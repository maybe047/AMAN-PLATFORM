<!DOCTYPE html>
<html lang="en" id="html-root">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AMAN | Line Checker</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body[dir="rtl"] {
      text-align: right;
    }
  </style>
</head>
<body>

  <div class="desktop-container">
    
    <!-- Top Navigation -->
    <header style="background-color: #F7EBEF; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-radius: 0 0 15px 15px;">
      <ul class="nav-links" style="list-style: none; display: flex; gap: 15px; margin: 0; padding: 0; align-items: center;">
        <li><a href="index.html" class="nav-home" style="text-decoration: none; color: #333; font-size: 14px;">Home</a></li>
        <li><a href="safety.html" class="nav-safety" style="text-decoration: none; color: #333; font-size: 14px;">Safety Center</a></li>
        <li><a href="checker.html" class="nav-checker" style="text-decoration: none; color: #333; font-size: 14px; font-weight: bold;">Line Checker</a></li>
        <li><a href="quiz.html" class="nav-quiz" style="text-decoration: none; color: #333; font-size: 14px;">Quiz</a></li>
        <li><a href="about.html" class="nav-about" style="text-decoration: none; color: #333; font-size: 14px;">About</a></li>
        <li><span id="lang-btn" class="lang-switch" style="background: #D9536E; color: white; padding: 3px 8px; border-radius: 4px; font-size: 12px; cursor: pointer; font-weight: bold;">AR | EN</span></li>
      </ul>
      <div class="logo" style="font-weight: bold; font-size: 20px; color: #2C1E3B;">AMAN</div>
    </header>

    <!-- Checker Hero Section -->
    <section class="hero">
      <h1 id="hero-title">Line Checker</h1>
      <p id="hero-desc">Verify suspicious URLs or messages instantly.</p>
    </section>

    <!-- Checker Box -->
    <div style="background-color: white; border-radius: 16px; padding: 35px; box-shadow: 0 4px 15px rgba(0,0,0,0.03); margin-bottom: 50px;">
      <h2 id="box-title" style="color: var(--purple-dark); margin-bottom: 15px;">Paste Link to Check</h2>
      <input type="text" id="url-input" placeholder="https://example.com" style="width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #ddd; margin-bottom: 15px; box-sizing: border-box; outline: none;">
      <button id="check-btn" class="btn-pink" style="cursor: pointer; width: 100%; padding: 12px; border-radius: 10px; border: none; font-weight: bold;">Check Safety</button>
      <div id="result-box" style="display: none; margin-top: 20px; padding: 15px; border-radius: 10px; font-weight: bold; text-align: center;"></div>
    </div>

    <!-- Footer -->
    <footer>
      <div style="text-align: center; color: white;">
        <h2 style="font-size: 24px; margin-bottom: 5px;">AMAN</h2>
        <p id="footer-rights" style="font-size: 13px; color: #D3C2CF; margin-bottom: 15px;">.AMAN. All Rights Reserved 2026 ©️</p>
      </div>
    </footer>

  </div>

  <!-- سكربت الترجمة والفحص الذكي للروابط -->
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const langBtn = document.getElementById("lang-btn");
      const htmlRoot = document.getElementById("html-root");
      const checkBtn = document.getElementById("check-btn");
      const urlInput = document.getElementById("url-input");
      const resultBox = document.getElementById("result-box");

      let currentLang = localStorage.getItem("aman_lang") || "en";

      function applyLanguage(lang) {
        if (lang === "ar") {
          htmlRoot.setAttribute("dir", "rtl");
          if(langBtn) langBtn.innerText = "EN | AR";

          document.querySelector(".nav-home").innerText = "الرئيسية";
          document.querySelector(".nav-safety").innerText = "مركز الأمان";
          document.querySelector(".nav-checker").innerText = "فحص الروابط";
          document.querySelector(".nav-quiz").innerText = "الاختبار";
          document.querySelector(".nav-about").innerText = "من نحن";

          document.getElementById("hero-title").innerText = "فحص الروابط";
          document.getElementById("hero-desc").innerText = "تحقق من الروابط أو الرسائل المشبوهة فوراً.";

          document.getElementById("box-title").innerText = "الصق الرابط لفحصه";
          document.getElementById("url-input").placeholder = "https://example.com";
          document.getElementById("check-btn").innerText = "فحص الأمان";

          document.getElementById("footer-rights").innerText = "جميع الحقوق محفوظة .AMAN. 2026 ©️";

        } else {
          htmlRoot.setAttribute("dir", "ltr");
          if(langBtn) langBtn.innerText = "AR | EN";

          document.querySelector(".nav-home").innerText = "Home";
          document.querySelector(".nav-safety").innerText = "Safety Center";
          document.querySelector(".nav-checker").innerText = "Line Checker";
          document.querySelector(".nav-quiz").innerText = "Quiz";
          document.querySelector(".nav-about").innerText = "About";

          document.getElementById("hero-title").innerText = "Line Checker";
          document.getElementById("hero-desc").innerText = "Verify suspicious URLs or messages instantly.";

          document.getElementById("box-title").innerText = "Paste Link to Check";
          document.getElementById("url-input").placeholder = "https://example.com";
          document.getElementById("check-btn").innerText = "Check Safety";

          document.getElementById("footer-rights").innerText = ".AMAN. All Rights Reserved 2026 ©️";
        }
      }

      applyLanguage(currentLang);

      if(langBtn) {
        langBtn.addEventListener("click", function () {
          currentLang = (currentLang === "en") ? "ar" : "en";
          localStorage.setItem("aman_lang", currentLang);
          applyLanguage(currentLang);
        });
      }

      // خوارزمية الفحص الذكي المحدثة لتلتقاط روابط التصيد الاحتيالي بدقة
      checkBtn.addEventListener("click", function () {
        const val = urlInput.value.trim().toLowerCase();
        resultBox.style.display = "block";

        if (val === "") {
          resultBox.style.backgroundColor = "#FFF3CD";
          resultBox.style.color = "#856404";
          resultBox.innerText = currentLang === "ar" ? "⚠️ الرجاء إدخال رابط أولاً للفحص." : "⚠️ Please enter a URL to check.";
          return;
        }

        // كلمات مفتاحية شاملة تدل على التصيد الاحتيالي (مثل support, verify, account, login وغيرها)
        const phishingKeywords = [
          "phish", "hack", "malware", "free-gift", "login-verify", "scam", 
          "support-verify", "account", "update", "secure-login", "verify-", "bank"
        ];

        let isSuspicious = phishingKeywords.some(word => val.includes(word));

        if (isSuspicious) {
          resultBox.style.backgroundColor = "#F8D7DA";
          resultBox.style.color = "#721C24";
          resultBox.innerText = currentLang === "ar" 
            ? "🚨 تحذير خطير! هذا الرابط يحتوي على مؤشرات تصيد احتيالي (Phishing) ويهدد أمان حسابك." 
            : "🚨 WARNING! This link contains phishing indicators and threatens your account security.";
        } else {
          resultBox.style.backgroundColor = "#D4EDDA";
          resultBox.style.color = "#155724";
          resultBox.innerText = currentLang === "ar" 
            ? "✅ هذا الرابط يبدو آمناً وخالياً من التهديدات المعروفة." 
            : "✅ This URL appears safe and clean of known threats.";
        }
      });
    });
  </script>

</body>
</html>
